[package]
name = "p2panda-file-sharing-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "p2panda-file-sharing-gui"
path = "src/main.rs"

[dependencies]
# p2panda
p2panda-blobs = { path = "../p2panda-blobs", features = ["fs-store"] }
p2panda-core = { path = "../p2panda-core" }
p2panda-net = { path = "../p2panda-net" }

# GUI
bevy = { version = "0.15", default-features = false, features = ["bevy_core_pipeline", "bevy_render", "bevy_text", "bevy_ui", "bevy_window", "bevy_winit", "multi_threaded", "x11", "wayland"] }
bevy_egui = { version = "0.34", default-features = false, features = ["default_fonts", "render"] }

# Async
tokio = { version = "1", features = ["full"] }
flume = "0.11"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
data-encoding = "2"
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Platform
rfd = "0.15"
directories = "5"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
iroh-blobs = "0.98.0"

[dev-dependencies]
tempfile = "3"
iroh = { version = "0.96.1", default-features = false, features = ["test-utils"] }
p2panda-net = { path = "../p2panda-net", features = ["test_utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
