[package]
name = "salience"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Attention estimation for ranking and replication in social applications"
keywords = ["attention", "ranking", "feed", "p2p", "recommendation"]
categories = ["algorithms"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"

[dev-dependencies]
rand_chacha = "0.9"
serde_json = "1"

# Standalone crate: detach from any enclosing cargo workspace.
[workspace]
