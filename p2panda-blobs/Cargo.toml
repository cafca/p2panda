[package]
name = "p2panda-blobs"
version = "0.7.0"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "glyph <glyph@mycelial.technology>",
]
description = "Blob storage, retrieval and synchronisation"
repository = "https://github.com/p2panda/p2panda"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["storage", "streaming", "blobs", "bao", "blake3"]
rust-version = "1.96"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["fs-store"]
fs-store = ["iroh-blobs/fs-store"]

[dependencies]
anyhow = "1"
futures-util = { workspace = true }
iroh-blobs = { version = "0.103", default-features = false }
p2panda-net = { workspace = true, default-features = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
p2panda-core = { workspace = true, default-features = true, features = ["test_utils"] }
p2panda-net = { workspace = true, default-features = true, features = ["test_utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
