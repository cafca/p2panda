[package]
name = "p2panda-blobs"
version = "0.5.1"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "glyph <glyph@mycelial.technology>",
]
description = "Blob storage, retrieval and synchronisation"
repository = "https://github.com/p2panda/p2panda"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["storage", "streaming", "blobs", "bao", "blake3"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["fs-store"]
fs-store = ["iroh-blobs/fs-store"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
iroh-blobs = { version = "0.98", default-features = false }
p2panda-net = { path = "../p2panda-net", version = "0.5.1" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
p2panda-net = { path = "../p2panda-net", features = ["test_utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
