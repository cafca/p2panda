[package]
name = "p2panda-file-sharing"
version = "0.1.0"
edition = "2021"

[dependencies]
p2panda-blobs = { path = "../p2panda-blobs" }
p2panda-core = { path = "../p2panda-core" }
p2panda-net = { path = "../p2panda-net" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
iroh = { version = "0.96.1", default-features = false, features = ["test-utils"] }
p2panda-net = { path = "../p2panda-net", features = ["test_utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
