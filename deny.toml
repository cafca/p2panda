[graph]
all-features = true

[advisories]
ignore = [
    # paste is not maintained anymore - used by netlink-packet-core > .. > netwatch .. > iroh.
    # https://github.com/rust-netlink/netlink-packet-core/issues/41
    {
      id = "RUSTSEC-2024-0436",
      reason = "Advisory is notice / INFO",
    },

    # proc-macro-error2 is not maintained anymore, used by hax-lib-macros > .. > hpke-rs.
    {
      id = "RUSTSEC-2026-0173",
      reason = "Advisory is notice / INFO",
    },

    # atomic-polyfill is unmaintained, pulled in via iroh-blobs > postcard > heapless.
    # No safe upgrade is available.
    {
      id = "RUSTSEC-2023-0089",
      reason = "Unmaintained transitive dependency of iroh-blobs, no upgrade available",
    },

    # proc-macro-error is unmaintained, pulled in via iroh-blobs > bao-tree > genawaiter.
    # No safe upgrade is available.
    {
      id = "RUSTSEC-2024-0370",
      reason = "Unmaintained transitive dependency of iroh-blobs, no upgrade available",
    },

    # ttf-parser is unmaintained, pulled in via Bevy's text rendering stack.
    # No upgrade available.
    {
      id = "RUSTSEC-2026-0192",
      reason = "Unmaintained transitive dependency of Bevy, no upgrade available",
    },

    # quick-xml DoS advisories, pulled in via wayland-scanner > winit > Bevy and
    # pinned to 0.39 by wayland-scanner (fix needs >=0.41). Only reached when
    # parsing local Wayland protocol descriptions on the desktop, not network input.
    {
      id = "RUSTSEC-2026-0194",
      reason = "Bevy/wayland-scanner transitive, not reachable from untrusted input",
    },
    {
      id = "RUSTSEC-2026-0195",
      reason = "Bevy/wayland-scanner transitive, not reachable from untrusted input",
    },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License, MIT-0, CC0, and the font licenses below are pulled
    # in by the file-sharing app's dependency tree (Bevy and its defaults).
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
